<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RAG + Ollama</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <main class="wrap">
    <header>
      <h1>Ask your documents</h1>
      <p class="sub">Retrieval-augmented answers from your local files, generated by Ollama.</p>
      <div id="status" class="status status--loading">Checking status…</div>
    </header>

    <form id="ask-form" class="ask">
      <input id="question" type="text" autocomplete="off"
             placeholder="e.g. What engine does the FZ25 have?" required>
      <button id="submit" type="submit">Ask</button>
    </form>

    <p class="hint">Press Enter to ask · <a href="/docs" target="_blank" rel="noreferrer">API docs</a></p>

    <section id="error" class="panel panel--error" hidden></section>

    <section id="answer-panel" class="panel" hidden>
      <h2>Answer</h2>
      <div id="answer" class="answer"></div>
      <p id="meta" class="meta"></p>
    </section>

    <section id="sources-panel" class="panel" hidden>
      <h2>Retrieved passages <span id="sources-count" class="count"></span></h2>
      <ol id="sources" class="sources"></ol>
    </section>
  </main>
  <script src="/static/script.js"></script>
</body>
</html>
